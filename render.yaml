services:
  - type: web
    name: veritrail-audit-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: veritrail-audit-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://veritrail-audit-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
